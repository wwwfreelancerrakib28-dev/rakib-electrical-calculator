<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="24 16" opacity="0.4" />

  <!-- Lightning Bolt -->
  <polygon points="280,64 128,272 248,272 208,448 384,232 264,232" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Small text banner -->
  <rect x="96" y="408" width="320" height="48" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="3" opacity="0.95" />
  <text x="256" y="440" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="24" font-weight="bold" fill="#fef08a" text-anchor="middle">রাকিব ইলেকট্রিক্যাল</text>
</svg>
